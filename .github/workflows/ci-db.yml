name: CI DB Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate-db:
    name: Release Gate (PostgreSQL efimero)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistemalegal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sistemalegal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistemalegal_ci
      VG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistemalegal_ci_test
      VG_RELEASE_GATE_MODE: full
      VG_SUITE_TIMEOUT_SEC: "900"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres -d sistemalegal_ci && exit 0
            sleep 2
          done
          echo "PostgreSQL no disponible en CI"
          exit 1

      - name: Prepare runtime and test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE sistemalegal_ci_test;"
          psql -h localhost -p 5432 -U postgres -d sistemalegal_ci -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -h localhost -p 5432 -U postgres -d sistemalegal_ci_test -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Run UI contracts
        run: |
          python -m pytest -q tests/test_ui_theme_contract.py tests/test_ui_visual_order_contract.py tests/test_ui_text_encoding_contract.py tests/test_ui_theme_persistence_db.py

      - name: Validate env contract (release_gate_full)
        run: |
          python db/env_contract.py --profile release_gate_full

      - name: Run release gate (full)
        run: |
          python db/release_gate.py --mode full
